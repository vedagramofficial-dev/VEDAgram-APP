
name: Import NimarkoGram Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VEDAgram repository
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: true

      - name: Checkout NimarkoGram source
        uses: actions/checkout@v4
        with:
          repository: Ettacent/NimarkoGram
          ref: main
          submodules: recursive
          fetch-depth: 0
          path: upstream

      - name: Copy Android project
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.git' \
            --exclude='.github/' \
            upstream/ target/

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          cd target

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Import NimarkoGram Android source"
          git push origin HEAD:main
