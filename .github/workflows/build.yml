
name: VEDAgram Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout NimarkoGram with submodules
        uses: actions/checkout@v4
        with:
          repository: Ettacent/NimarkoGram
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native tools
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :TMessagesProj_App:assembleAfatRelease

      - name: Find generated APKs
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEDAgram-Android-APK
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
