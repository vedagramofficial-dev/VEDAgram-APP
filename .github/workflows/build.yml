name: VEDAgram Android Build
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "VEDAgram version name"
        required: true
        default: "13.0.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout VEDAgram source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply complete VEDAgram branding
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/vedagram-branding"
          cat > "$RUNNER_TEMP/vedagram-branding/icon.b64" <<'ICON_B64'

ICON_B64
          base64 --decode "$RUNNER_TEMP/vedagram-branding/icon.b64" > "$RUNNER_TEMP/vedagram-branding/vedagram_launcher.png"
          export VEDAGRAM_ICON="$RUNNER_TEMP/vedagram-branding/vedagram_launcher.png"
          python - <<'PY'
          import re, shutil
          from pathlib import Path
          from PIL import Image

          # App name and onboarding copy across all Android language variants.
          res = Path("TMessagesProj/src/main/res")
          if res.exists():
              for f in res.glob("values*/strings*.xml"):
                  old = f.read_text(encoding="utf-8")
                  new = old.replace("NimarkoGram", "VEDAgram").replace("NIMARKOGRAM", "VEDAGRAM")
                  for key, value in (("AppName","VEDAgram"),("AppNameBeta","VEDAgram Beta"),("exteraAppName","VEDAgram")):
                      pattern = r'(<string\b[^>]*\bname="' + re.escape(key) + r'"[^>]*>).*?(</string>)'
                      new = re.sub(pattern, lambda m: m.group(1)+value+m.group(2), new, flags=re.DOTALL)
                  if new != old:
                      f.write_text(new, encoding="utf-8")

          # Remove hard-coded old name in intro/fallback code without renaming packages/classes.
          for rel in (
              "TMessagesProj/src/main/java/app/nimarkogram/messenger/utils/text/LocaleUtils.java",
              "TMessagesProj/src/main/java/com/exteragram/messenger/utils/text/LocaleUtils.java",
              "TMessagesProj/src/main/java/org/telegram/ui/IntroActivity.java",
              "TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ThemeColors.java",
          ):
              f = Path(rel)
              if not f.exists():
                  continue
              old = f.read_text(encoding="utf-8")
              new = old.replace('"NimarkoGram"', '"VEDAgram"').replace("NimarkoGram", "VEDAgram")
              if f.name == "ThemeColors.java":
                  new = re.sub(r'(public static final int TELEGRAM_COLOR\s*=\s*)0x[0-9A-Fa-f]+;', r'\g<1>0xFF8B5CF6;', new)
              if new != old:
                  f.write_text(new, encoding="utf-8")

          # Replace launcher icons for standard, round, and adaptive foreground resources.
          import os
          source = Path(os.environ["VEDAGRAM_ICON"])
          if not source.exists():
              raise SystemExit("VEDAgram launcher icon asset is missing")
          for folder in res.glob("mipmap-*"):
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  target = folder / name
                  if target.exists():
                      size = Image.open(target).size
                      img = Image.open(source).convert("RGBA").resize(size, Image.Resampling.LANCZOS)
                      img.save(target, format="PNG")
          # Also replace drawable foreground variants if the adaptive icon XML points there.
          for folder in res.glob("drawable*"):
              for name in ("ic_launcher_foreground.png", "ic_launcher.png", "ic_launcher_round.png"):
                  target = folder / name
                  if target.exists():
                      size = Image.open(target).size
                      img = Image.open(source).convert("RGBA").resize(size, Image.Resampling.LANCZOS)
                      img.save(target, format="PNG")
          print("VEDAgram strings, intro branding, and launcher icon assets updated.")
          PY

      - name: Set real Android version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("gradle.properties")
          text = p.read_text(encoding="utf-8")
          version = os.environ["APP_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Version must use format like 13.0.2")
          code = 7553 + int(os.environ["BUILD_NUMBER"])
          def setp(s, key, value):
              pat = rf"(?m)^{re.escape(key)}=.*$"
              line = f"{key}={value}"
              return re.sub(pat, lambda _: line, s) if re.search(pat,s) else s.rstrip()+"\n"+line+"\n"
          text = setp(text, "APP_VERSION_NAME", version)
          text = setp(text, "APP_VERSION_CODE", str(code))
          p.write_text(text, encoding="utf-8")
          print(f"versionName={version}; versionCode={code}")
          PY


      - name: Add VEDA Update Center resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("TMessagesProj/src/main/res")
          vals = root / "values"
          vals.mkdir(parents=True, exist_ok=True)
          f = vals / "strings.xml"
          if not f.exists():
              f.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n', encoding="utf-8")
          text = f.read_text(encoding="utf-8")
          entries = {
            "veda_update_center": "VEDA Update Center",
            "veda_update_center_title": "VEDAgram Update Center",
            "veda_update_center_version": "Installed version",
            "veda_update_center_build": "Build number",
            "veda_update_center_check": "Check for updates",
            "veda_update_center_unavailable": "Update source is not configured yet",
            "veda_update_center_description": "Manage VEDAgram version information"
          }
          for key, value in entries.items():
            line = f'<string name="{key}">{value}</string>'
            if f'name="{key}"' in text:
              text = re.sub(r'<string\\b[^>]*\\bname="' + re.escape(key) + r'"[^>]*>.*?</string>', line, text, count=1, flags=re.S)
            else:
              text = text.replace("</resources>", "    " + line + "\n</resources>", 1)
          f.write_text(text, encoding="utf-8")
          assets = Path("TMessagesProj/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "veda_update_center.html").write_text("""<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEDAgram Update Center</title>
<style>
body{margin:0;padding:24px;background:linear-gradient(145deg,#10091c,#211039);color:#fff;font:16px system-ui}
main{max-width:520px;margin:auto;padding:24px;border:1px solid #9333ea;border-radius:24px;background:#1b1030;box-shadow:0 0 28px #9333ea33}
.logo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#7e22ce,#e879f9);font-size:30px;font-weight:800}
h1{font-size:24px}.muted{color:#c4b5d7;line-height:1.5}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #3b2852}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#9333ea,#c026d3);color:white;font-weight:700}
</style><main><div class="logo">V</div><h1>VEDAgram Update Center</h1>
<p class="muted">Version and build information for your VEDAgram installation.</p>
<div class="row"><span class="muted">Installed version</span><b>Shown in app version</b></div>
<div class="row"><span class="muted">Build number</span><b>Included in APK</b></div>
<p id="status" class="muted">A trusted update source is not configured yet. Live update checking is not active.</p>
<button onclick="document.getElementById('status').textContent='No official update endpoint is configured. This screen will not download or install APK files.'">Check for updates</button>
<p class="muted">Install updates only from the official VEDAgram release source.</p></main></html>""", encoding="utf-8")
          print("VEDA Update Center resources added.")
          PY

      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare pinned Media3 source
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_DIR="TMessagesProj_Modules/media"
          REVISION="c430d207677071b1873f9f18266d55ec45722180"
          test -f patches/media3-ffmpeg-video.patch
          rm -rf "$MEDIA_DIR"
          git clone https://github.com/Arseny271/media.git "$MEDIA_DIR"
          git -C "$MEDIA_DIR" checkout --detach "$REVISION"
          test "$(git -C "$MEDIA_DIR" rev-parse HEAD)" = "$REVISION"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Sign APK with VEDAgram release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "Missing GitHub Secret: $name"; exit 1; fi
          done
          KEYSTORE="$RUNNER_TEMP/vedagram-release.jks"
          SIGN_DIR="$GITHUB_WORKSPACE/signed-apks"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE" && test -x "$APKSIGNER"
          mkdir -p "$SIGN_DIR"
          mapfile -d '' APKS < <(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "${#APKS[@]}" -eq 0 ]; then echo "No APK files were found."; exit 1; fi
          for APK in "${APKS[@]}"; do
            REL="${APK#TMessagesProj_App/build/outputs/apk/}"
            OUT="$SIGN_DIR/$REL"
            mkdir -p "$(dirname "$OUT")"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$OUT" "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$OUT"
          done
          rm -f "$KEYSTORE"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDAgram-Android-APK
          path: signed-apks/**/*.apk
          if-no-files-found: error
          retention-days: 7
