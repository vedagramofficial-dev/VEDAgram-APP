
name: VEDAgram Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NimarkoGram with submodules
        uses: actions/checkout@v4
        with:
          repository: Ettacent/NimarkoGram
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle project
        run: |
          chmod +x gradlew
          ./gradlew projects
