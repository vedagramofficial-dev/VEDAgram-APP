
name: VEDAgram Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout NimarkoGram with submodules
        uses: actions/checkout@v4
        with:
          repository: Ettacent/NimarkoGram
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found: ${ANDROID_HOME}"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify build tools
        run: |
          java -version
          python --version
          python3.11 --version
          git --version

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :TMessagesProj_App:assembleAfatRelease

      - name: Sign APK with VEDAgram release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/vedagram-release.jks"
          SIGN_DIR="$GITHUB_WORKSPACE/signed-apks"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"
          test -x "$APKSIGNER"

          mkdir -p "$SIGN_DIR"

          mapfile -d '' APKS < <(
            find TMessagesProj_App/build/outputs/apk \
              -type f -name '*.apk' -print0
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK files were found."
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            RELATIVE_PATH="${APK#TMessagesProj_App/build/outputs/apk/}"
            OUTPUT="$SIGN_DIR/$RELATIVE_PATH"

            mkdir -p "$(dirname "$OUTPUT")"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$OUTPUT" \
              "$APK"

            "$APKSIGNER" verify --verbose --print-certs "$OUTPUT"

            echo "Successfully signed: $RELATIVE_PATH"
          done

          rm -f "$KEYSTORE"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEDAgram-Android-APK
          path: signed-apks/**/*.apk
          if-no-files-found: error
          retention-days: 7
